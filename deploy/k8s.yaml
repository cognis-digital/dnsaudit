apiVersion: apps/v1
kind: Deployment
metadata: { name: dnsaudit, labels: { app: dnsaudit } }
spec:
  replicas: 1
  selector: { matchLabels: { app: dnsaudit } }
  template:
    metadata: { labels: { app: dnsaudit } }
    spec:
      containers:
        - name: dnsaudit
          image: ghcr.io/cognis-digital/dnsaudit:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: dnsaudit }
spec:
  selector: { app: dnsaudit }
  ports: [{ port: 80, targetPort: 8000 }]
